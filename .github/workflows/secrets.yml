name: Secret scan
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install verified Gitleaks 8.30.1
        shell: bash
        run: |
          curl --fail --location --silent --show-error --output /tmp/gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tgz' | sha256sum --check
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
      - name: Scan complete history and checkout (redacted)
        run: |
          /tmp/gitleaks git . --redact=100 --no-banner --log-opts=--all
          /tmp/gitleaks dir . --redact=100 --no-banner
